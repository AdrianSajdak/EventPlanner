name: Build Android APK

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Verify google-services.json present
        run: test -f google-services.json || (echo "Missing google-services.json in repo root" && exit 1)

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             artifacts/EventPlanner-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EventPlanner-android-${{ github.run_number }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
